<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    GitHub Pages cannot send response headers, so the Content Security Policy
    lives here. It allows exactly the hosts the app talks to: the YouTube
    IFrame API and its player frames, YouTube thumbnails, and the oEmbed
    endpoint. Inline styles are set through the CSSOM (element.style), which
    CSP permits without 'unsafe-inline'. frame-ancestors is ignored in a meta
    tag, so it is deliberately absent.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; img-src 'self' data: https://i.ytimg.com https://*.ytimg.com; connect-src https://www.youtube.com; style-src 'self'; font-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111b" />
  <meta name="description" content="CourseTracker turns YouTube playlists into local-first course dashboards with progress tracking." />
  <title>CourseTracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c4dff'/%3E%3Cpath d='M24 18l24 14-24 14z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app"></div>
  <noscript>CourseTracker requires JavaScript because all course data is stored locally in your browser.</noscript>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
